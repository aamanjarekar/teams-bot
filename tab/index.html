<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineering Ops Copilot</title>
<style>
  /* Minimal reset. The page's own tokens set colours below. */
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<script type="module" src="/src/teams-init.ts"></script>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   TOKENS — every token declared here in bare :root first, so the
   un-stamped (system-theme) document always resolves a full set.
   ============================================================ */
:root{
  --ground:#F4F7FA; --surface:#FFFFFF; --surface-2:#EDF1F6; --surface-3:#E3EAF2;
  --border:#D7E0E9; --border-strong:#BFCCD9;
  --ink:#16202B; --ink-2:#55636F; --ink-3:#8593A1;
  --accent:#1A5AA8; --accent-ink:#134A8C; --accent-soft:#E7EFF9;
  --good:#1E7A54; --good-soft:#E4F1EB;
  --warn:#B0800C; --warn-soft:#F7EEDA;
  --crit:#B01E28; --crit-soft:#F8E6E7;
  --shadow-drawer:-8px 0 40px rgba(22,32,43,.16);
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px; --r-lg:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E141A; --surface:#151D25; --surface-2:#1C262F; --surface-3:#243039;
    --border:#2A3742; --border-strong:#3A4A57;
    --ink:#E4EBF2; --ink-2:#9BA9B6; --ink-3:#6C7C8A;
    --accent:#4F95DE; --accent-ink:#7FB2E8; --accent-soft:#17293C;
    --good:#33A574; --good-soft:#14291F;
    --warn:#B58B26; --warn-soft:#2A2313;
    --crit:#DE666E; --crit-soft:#2E1A1C;
    --shadow-drawer:-8px 0 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#0E141A; --surface:#151D25; --surface-2:#1C262F; --surface-3:#243039;
  --border:#2A3742; --border-strong:#3A4A57;
  --ink:#E4EBF2; --ink-2:#9BA9B6; --ink-3:#6C7C8A;
  --accent:#4F95DE; --accent-ink:#7FB2E8; --accent-soft:#17293C;
  --good:#33A574; --good-soft:#14291F;
  --warn:#B58B26; --warn-soft:#2A2313;
  --crit:#DE666E; --crit-soft:#2E1A1C;
  --shadow-drawer:-8px 0 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
@media (max-width:760px){.app{grid-template-columns:1fr}}

.rail{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:4px;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media (max-width:760px){.rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;flex-shrink:0}
.brand-name{font-family:var(--display);font-weight:600;font-size:13.5px;line-height:1.25}
.brand-sub{font-size:10.5px;color:var(--ink-3)}

.nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:760px){.nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r);color:var(--ink-2);font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:background .12s,color .12s}
@media (max-width:760px){.nav-item{width:auto;white-space:nowrap}}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav-item .ico{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.nav-count{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--border);font-size:11px;color:var(--ink-3);line-height:1.45}
@media (max-width:760px){.rail-foot{display:none}}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;gap:14px;align-items:center;padding:14px 26px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative;display:flex;align-items:center}
.search .ico{position:absolute;left:11px;color:var(--ink-3);font-size:13px;pointer-events:none}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:var(--r);background:var(--ground);color:var(--ink);font-size:13.5px;font-family:var(--body)}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.demo-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:600;border:1px solid var(--warn)}
.theme-btn{padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;color:var(--ink-2)}
.theme-btn:hover{background:var(--surface-2);color:var(--ink)}

.view{padding:24px 26px 56px;max-width:1180px;display:none;flex-direction:column;gap:22px}
.view[data-active="true"]{display:flex}
.view-head{display:flex;flex-direction:column;gap:5px}
.view-head h1{font-size:21px;font-weight:600}
.view-head p{margin:0;color:var(--ink-2);max-width:62ch;font-size:13.5px}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.panel-head{display:flex;align-items:baseline;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.panel-head h3{font-size:13px;font-weight:600;letter-spacing:.01em}
.panel-head .hint{margin-left:auto;font-size:11px;color:var(--ink-3)}
.panel-body{padding:14px 16px}
.panel-foot{padding:10px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
.link-btn{color:var(--accent);font-size:12.5px;font-weight:600;padding:0}
.link-btn:hover{text-decoration:underline}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* status pills — colour PLUS glyph and text, never colour alone */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill-crit{background:var(--crit-soft);color:var(--crit)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-good{background:var(--good-soft);color:var(--good)}
.pill-mute{background:var(--surface-2);color:var(--ink-2)}
.pill-accent{background:var(--accent-soft);color:var(--accent-ink)}
.chip{display:inline-block;padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-size:11px;font-family:var(--mono)}

/* KPI tiles — the four figures the page leads on */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 15px;display:flex;flex-direction:column;gap:4px;text-align:left;transition:border-color .12s,transform .12s}
.kpi:hover{border-color:var(--accent);transform:translateY(-1px)}
.kpi-val{font-family:var(--display);font-size:27px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpi-label{font-size:12px;color:var(--ink-2)}
.kpi-note{font-size:11px;color:var(--ink-3)}
.kpi-severity{width:26px;height:3px;border-radius:2px;margin-bottom:3px}

/* rows / lists */
.row-list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--border);text-align:left;width:100%;transition:background .1s}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row-stripe{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0;min-height:30px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:13.5px;font-weight:500;line-height:1.35}
.row-meta{font-size:11.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.row-chevron{color:var(--ink-3);font-size:15px;flex-shrink:0}

/* bar chart — single series, single hue, direct-labelled, baseline-anchored */
.bars{display:flex;flex-direction:column;gap:2px}
.bar-row{display:grid;grid-template-columns:150px 1fr 62px;gap:10px;align-items:center;padding:6px 16px;text-align:left;width:100%;transition:background .1s}
.bar-row:hover{background:var(--surface-2)}
.bar-label{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:16px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar-val{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:640px){.bar-row{grid-template-columns:96px 1fr 52px}}

/* expert & knowledge cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.ecard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:9px;text-align:left;transition:border-color .12s,transform .12s}
.ecard:hover{border-color:var(--accent);transform:translateY(-1px)}
.ecard-top{display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:12.5px;flex-shrink:0}
.ecard-name{font-size:13.5px;font-weight:600;line-height:1.25}
.ecard-role{font-size:11.5px;color:var(--ink-3)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.ecard-stat{margin-top:auto;font-size:11.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--border);padding-top:8px}

/* systems */
.sys{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:0;overflow:hidden;text-align:left;transition:border-color .12s}
.sys:hover{border-color:var(--accent)}
.sys-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--border)}
.sys-name{font-family:var(--display);font-size:14px;font-weight:600}
.sys-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
.sys-cell{background:var(--surface);padding:10px 12px}
.sys-cell .v{font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.sys-cell .l{font-size:10.5px;color:var(--ink-3)}

/* roadmap */
.prio-head{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border)}
.prio-tag{font-family:var(--mono);font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px}
.p0{background:var(--crit-soft);color:var(--crit)}
.p1{background:var(--warn-soft);color:var(--warn)}
.p2{background:var(--surface-2);color:var(--ink-2)}
.prio-title{font-size:12.5px;font-weight:600}
.prio-prog{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.feat{display:flex;align-items:center;gap:9px;padding:8px 15px;border-bottom:1px solid var(--border);font-size:13px}
.feat:last-child{border-bottom:none}
.feat-ico{width:15px;flex-shrink:0;font-size:12px;text-align:center}
.feat-name{flex:1;min-width:0}
.feat-st{font-size:9.5px;flex-shrink:0}
.st-ship{color:var(--good)} .st-prog{color:var(--warn)} .st-plan{color:var(--ink-3)}

.ws{border-bottom:1px solid var(--border)}
.ws:last-child{border-bottom:none}
.ws-head{display:flex;align-items:center;gap:11px;padding:11px 16px;width:100%;text-align:left;transition:background .1s}
.ws-head:hover{background:var(--surface-2)}
.ws-n{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:16px;flex-shrink:0}
.ws-name{font-size:13.5px;font-weight:500;flex:1;min-width:0}
.meter{width:96px;height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;flex-shrink:0}
.meter-fill{display:block;height:100%;border-radius:3px}
.ws-pct{font-size:11.5px;color:var(--ink-2);width:34px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
@media (max-width:640px){.meter{width:52px}}
.ws-body{padding:2px 16px 14px 43px;display:none;flex-direction:column;gap:9px}
.ws-body[data-open="true"]{display:flex}
.ws-deliver{font-size:12.5px;color:var(--ink-2);border-left:2px solid var(--accent);padding-left:10px}
.task-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:2px 16px}
.task{font-size:12.5px;color:var(--ink-2);display:flex;gap:7px;align-items:baseline}

.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--border)}
@media (max-width:820px){.weeks{grid-template-columns:repeat(2,1fr)}}
.week{background:var(--surface);padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.week[data-now="true"]{background:var(--accent-soft)}
.week-n{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.week-goal{font-size:12.5px;font-weight:600;line-height:1.3}
.week-focus{font-size:11.5px;color:var(--ink-2);line-height:1.5}

/* activity feed */
.act{display:flex;gap:11px;padding:9px 16px;border-bottom:1px solid var(--border);align-items:center;text-align:left;width:100%;transition:background .1s}
.act:last-child{border-bottom:none}
.act:hover{background:var(--surface-2)}
.act-ico{width:22px;height:22px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:11px;flex-shrink:0}
.act-main{flex:1;min-width:0;display:flex;flex-direction:column}
.act-q{font-size:12.5px;font-family:var(--mono);color:var(--ink)}
.act-meta{font-size:11px;color:var(--ink-3)}

.empty{padding:30px 16px;text-align:center;color:var(--ink-3);font-size:13px}

/* ============================================================
   DRAWER — the click-through detail surface
   ============================================================ */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.42);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim[data-open="true"]{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-drawer);transform:translateX(101%);transition:transform .2s ease;z-index:50;display:flex;flex-direction:column}
.drawer[data-open="true"]{transform:translateX(0)}
.drawer-head{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--border)}
.drawer-head h2{font-size:16.5px;font-weight:600;line-height:1.3}
.drawer-close{width:28px;height:28px;border-radius:var(--r);color:var(--ink-3);font-size:16px;flex-shrink:0;display:grid;place-items:center}
.drawer-close:hover{background:var(--surface-2);color:var(--ink)}
.drawer-body{padding:16px 18px 40px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.d-sec{display:flex;flex-direction:column;gap:8px}
.d-sec > .eyebrow{padding-bottom:3px;border-bottom:1px solid var(--border)}
.kv{display:grid;grid-template-columns:112px 1fr;gap:5px 12px;font-size:13px;margin:0}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0;color:var(--ink);min-width:0}
.prose{font-size:13px;color:var(--ink-2);line-height:1.6;margin:0}
.prose strong{color:var(--ink);font-weight:600}

/* timeline — a real sequence, so the ordering carries information */
.tl{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:16px 1fr;gap:11px;padding-bottom:13px;position:relative}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:7px;top:15px;bottom:0;width:1px;background:var(--border)}
.tl-item:last-child::before{display:none}
.tl-dot{display:block;width:9px;height:9px;border-radius:50%;background:var(--border-strong);margin:4px auto 0;position:relative;z-index:1}
.tl-dot[data-kind="crit"]{background:var(--crit)} .tl-dot[data-kind="good"]{background:var(--good)}
.tl-dot[data-kind="warn"]{background:var(--warn)} .tl-dot[data-kind="accent"]{background:var(--accent)}
.tl-when{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tl-what{font-size:13px;line-height:1.45}
.tl-who{font-size:11.5px;color:var(--ink-3)}

.mini{display:flex;flex-direction:column;gap:4px}
.mini-row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);text-align:left;width:100%;font-size:12.5px;transition:border-color .12s,background .1s}
.mini-row:hover{border-color:var(--accent);background:var(--surface-2)}
.mini-row .m-title{flex:1;min-width:0}
</style>

<div class="app">
  <!-- ============ LEFT RAIL ============ -->
  <nav class="rail" aria-label="Sections">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">EO</div>
      <div>
        <div class="brand-name">Engineering Ops</div>
        <div class="brand-sub">Copilot &middot; Teams tab</div>
      </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot">
      Demo data &mdash; wire to<br><span class="mono">localhost:4000</span> next
    </div>
  </nav>

  <div class="main">
    <!-- ============ TOP BAR ============ -->
    <div class="topbar">
      <label class="search">
        <span class="ico" aria-hidden="true">&#9906;</span>
        <input type="search" id="q" placeholder="Search knowledge, experts, incidents&hellip;" aria-label="Search everything">
      </label>
      <span class="demo-chip" title="Seed rows from api/src/db.ts plus example rows drawn from the plan">&#9888; Demo data</span>
      <button class="theme-btn" id="themeBtn" aria-label="Switch colour theme">Theme</button>
    </div>

    <!-- ============ VIEWS ============ -->
    <section class="view" id="v-overview" data-active="true"></section>
    <section class="view" id="v-incidents"></section>
    <section class="view" id="v-experts"></section>
    <section class="view" id="v-knowledge"></section>
    <section class="view" id="v-systems"></section>
    <section class="view" id="v-roadmap"></section>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true">
  <div class="drawer-head">
    <div style="flex:1;min-width:0">
      <div class="eyebrow" id="drawerKind">Detail</div>
      <h2 id="drawerTitle">&nbsp;</h2>
    </div>
    <button class="drawer-close" id="drawerClose" aria-label="Close panel">&times;</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>
/* ================================================================
   DATA — extend these arrays and the whole dashboard follows.
   Rows marked seed:true are the real seed rows in api/src/db.ts.
   Everything else is example data drawn from Project_Info.md.
   ================================================================ */
const DATA = {

/* ---------- derived lookups ---------- */
const byId=(arr,id)=>arr.find(x=>x.id===id);
const inc=code=>DATA.incidents.find(i=>i.code===code);
const expByName=n=>DATA.experts.find(e=>e.name===n);
const openIncidents=()=>DATA.incidents.filter(i=>i.status!=="Resolved");
const sysIncidents=sid=>DATA.incidents.filter(i=>i.category===sid);
const sysExperts=sid=>DATA.experts.filter(e=>e.skills.some(s=>s[0]===sid));
const sysKnowledge=sid=>{const s=byId(DATA.systems,sid);return s?DATA.knowledge.filter(k=>k.system===s.name):[];};
const expIncidents=name=>DATA.incidents.filter(i=>i.experts.includes(name));
const initials=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PRIO={High:{cls:"pill-crit",ico:"▲"},Medium:{cls:"pill-warn",ico:"◆"},Low:{cls:"pill-mute",ico:"▼"}};
const STATUS={
  "Resolved":{cls:"pill-good",ico:"✓"},
  "In progress":{cls:"pill-warn",ico:"◔"},
  "Awaiting acknowledgement":{cls:"pill-crit",ico:"○"}
};
const FEAT={ship:{ico:"✓",cls:"st-ship",label:"Shipped"},prog:{ico:"◔",cls:"st-prog",label:"In progress"},plan:{ico:"○",cls:"st-plan",label:"Planned"}};
const sevColor=p=>p==="High"?"var(--crit)":p==="Medium"?"var(--warn)":"var(--border-strong)";
const meterColor=p=>p>=60?"var(--good)":p>=25?"var(--warn)":"var(--crit)";

const pill=(cls,ico,txt)=>'<span class="pill '+cls+'">'+ico+" "+esc(txt)+"</span>";
const prioPill=p=>pill(PRIO[p].cls,PRIO[p].ico,p);
const statPill=s=>pill(STATUS[s].cls,STATUS[s].ico,s);

  '<div class="view-head"><div class="eyebrow">Directory</div><h1>Experts</h1>'+
    '<p>Who is most likely to help. Ranked within a topic by incidents resolved. Open a profile for skills, systems and history.</p></div>'+
  teams.map(t=>
    '<div><div class="eyebrow" style="margin-bottom:9px">'+esc(t)+'</div><div class="card-grid">'+
      DATA.experts.filter(e=>e.team===t).map(e=>{
        const total=e.skills.reduce((a,s)=>a+s[1],0);
        const known=e.skills.map(s=>s[2]).filter(x=>x!=="Unknown");
        return '<button class="ecard" data-expert="'+e.id+'">'+
          '<span class="ecard-top"><span class="avatar" aria-hidden="true">'+initials(e.name)+'</span>'+
            '<span><span class="ecard-name">'+esc(e.name)+'</span><br><span class="ecard-role">'+esc(e.role)+'</span></span></span>'+
          '<span class="tags">'+e.skills.map(s=>'<span class="chip">'+s[0]+'</span>').join("")+'</span>'+
          '<span class="ecard-stat"><span>'+total+' resolved</span><span>'+(known.length?esc(known[0]):"No history")+'</span></span>'+
        '</button>';
      }).join("")+
    '</div></div>').join("");
}

function viewKnowledge(){
  return ''+
  '<div class="view-head"><div class="eyebrow">Reusable resolutions</div><h1>Knowledge</h1>'+
    '<p>Every resolved incident should leave an article behind. Open one for the full record &mdash; symptoms, resolution and source.</p></div>'+
  '<div class="card-grid">'+DATA.knowledge.map(k=>
    '<button class="ecard" data-knowledge="'+k.id+'">'+
      '<span class="ecard-top" style="align-items:flex-start">'+
        '<span style="flex:1;min-width:0"><span class="ecard-name">'+esc(k.issue)+'</span><br>'+
          '<span class="ecard-role">'+esc(k.system)+' &middot; '+esc(k.team)+'</span></span>'+
        (k.hasDoc?pill("pill-good","✓","Published"):pill("pill-warn","◔","Draft"))+'</span>'+
      '<span class="prose" style="font-size:12px;display:block">'+esc(k.symptoms.slice(0,92))+'&hellip;</span>'+
      '<span class="tags">'+k.tags.map(t=>'<span class="chip">'+t+'</span>').join("")+'</span>'+
      '<span class="ecard-stat"><span>reused '+k.reuse+'&times;</span><span class="mono">'+esc(k.source)+'</span></span>'+
    '</button>').join("")+'</div>';
}

function viewSystems(){
  return ''+
  '<div class="view-head"><div class="eyebrow">Applications</div><h1>Systems</h1>'+
    '<p>The applications the Copilot reasons about. Each one links people, incidents and knowledge &mdash; the knowledge graph in the plan.</p></div>'+
  '<div class="grid-2">'+DATA.systems.map(s=>{
    const is=sysIncidents(s.id), op=is.filter(i=>i.status!=="Resolved"), ex=sysExperts(s.id), kb=sysKnowledge(s.id);
    const resolved=ex.reduce((a,e)=>a+e.skills.filter(k=>k[0]===s.id).reduce((b,k)=>b+k[1],0),0);
    return '<button class="sys" data-system="'+s.id+'">'+
      '<span class="sys-head"><span style="flex:1;min-width:0"><span class="sys-name">'+esc(s.name)+'</span><br>'+
        '<span class="ecard-role">'+esc(s.team)+'</span></span>'+
        (op.length?pill("pill-crit","●",op.length+" open"):pill("pill-good","✓","Clear"))+'</span>'+
      '<span class="sys-grid">'+
        '<span class="sys-cell"><span class="v">'+ex.length+'</span><br><span class="l">Experts</span></span>'+
        '<span class="sys-cell"><span class="v">'+is.length+'</span><br><span class="l">Incidents</span></span>'+
        '<span class="sys-cell"><span class="v">'+kb.length+'</span><br><span class="l">Articles</span></span>'+
        '<span class="sys-cell"><span class="v">'+resolved+'</span><br><span class="l">Resolved</span></span>'+
      '</span></button>';
  }).join("")+'</div>';
}

function viewRoadmap(){
  const mean=DATA.workstreams.reduce((a,w)=>a+w.pct,0)/DATA.workstreams.length;
  return ''+
  '<div class="view-head"><div class="eyebrow">Six-week hackathon plan</div><h1>Feature roadmap</h1>'+
    '<p>The priority order and twelve workstreams from the plan. Open a workstream for its task list and deliverable.</p></div>'+

  '<div class="panel"><div class="panel-head"><h3>Overall</h3><span class="hint">mean across 12 workstreams</span></div>'+
    '<div class="panel-body" style="display:flex;align-items:center;gap:14px">'+
      '<span class="kpi-val" style="font-size:23px">'+Math.round(mean)+'%</span>'+
      '<span class="meter" style="flex:1;width:auto;height:7px"><span class="meter-fill" style="width:'+mean+'%;background:var(--accent)"></span></span>'+
    '</div></div>'+

  '<div class="grid-3">'+DATA.priorities.map((p,idx)=>{
    const ship=p.items.filter(i=>i[1]==="ship").length;
    return '<div class="panel"><div class="prio-head">'+
      '<span class="prio-tag p'+idx+'">'+p.tier+'</span>'+
      '<span class="prio-title">'+esc(p.title)+'</span>'+
      '<span class="prio-prog">'+ship+"/"+p.items.length+'</span></div>'+
      p.items.map(it=>
        '<div class="feat"><span class="feat-ico '+FEAT[it[1]].cls+'" aria-hidden="true">'+FEAT[it[1]].ico+'</span>'+
          '<span class="feat-name">'+esc(it[0])+'</span>'+
          '<span class="eyebrow feat-st '+FEAT[it[1]].cls+'">'+FEAT[it[1]].label+'</span></div>').join("")+
    '</div>';
  }).join("")+'</div>'+

  '<div class="panel"><div class="panel-head"><h3>Workstreams</h3><span class="hint">click to expand tasks</span></div>'+
    DATA.workstreams.map(w=>
      '<div class="ws"><button class="ws-head" data-ws="'+w.n+'" aria-expanded="false" aria-controls="ws-'+w.n+'">'+
        '<span class="ws-n">'+String(w.n<10?"0"+w.n:w.n)+'</span>'+
        '<span class="ws-name">'+esc(w.name)+'</span>'+
        '<span class="meter"><span class="meter-fill" style="width:'+w.pct+'%;background:'+meterColor(w.pct)+'"></span></span>'+
        '<span class="ws-pct">'+w.pct+'%</span>'+
        '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>'+
        '<div class="ws-body" id="ws-'+w.n+'">'+
          '<div class="ws-deliver"><strong>Deliverable.</strong> '+esc(w.deliverable)+'</div>'+
          '<div class="task-list">'+w.tasks.map(t=>'<span class="task"><span style="color:var(--ink-3)">&bull;</span>'+esc(t)+'</span>').join("")+'</div>'+
        '</div></div>').join("")+
  '</div>'+

  '<div class="panel"><div class="panel-head"><h3>Six-week target</h3><span class="hint">week 6 of 6</span></div>'+
    '<div class="weeks">'+DATA.weeks.map(w=>
      '<div class="week" '+(w.n===6?'data-now="true"':"")+'>'+
        '<span class="week-n">WEEK '+w.n+'</span>'+
        '<span class="week-goal">'+esc(w.goal)+'</span>'+
        '<span class="week-focus">'+esc(w.focus)+'</span></div>').join("")+
    '</div></div>';
}

const RENDER={overview:viewOverview,incidents:viewIncidents,experts:viewExperts,knowledge:viewKnowledge,systems:viewSystems,roadmap:viewRoadmap};

/* ================================================================
   DRAWERS — incident history, expert profile, article, system
   ================================================================ */
function drawerIncident(code){
  const i=inc(code); if(!i) return null;
  const kb=byId(DATA.knowledge,i.knowledge);
  return {kind:"Incident "+i.code, title:i.title, body:''+
    '<div class="d-sec"><div style="display:flex;gap:6px;flex-wrap:wrap">'+
      statPill(i.status)+prioPill(i.priority)+
      '<span class="pill pill-mute">'+esc(i.category)+'</span>'+
      (i.seed?'<span class="pill pill-accent">seed row</span>':"")+'</div></div>'+

    '<div class="d-sec"><div class="eyebrow">Assignment</div><dl class="kv">'+
      '<dt>Team</dt><dd>'+esc(i.team)+'</dd>'+
      '<dt>Experts</dt><dd>'+i.experts.map(n=>{const e=expByName(n);
        return e?'<button class="link-btn" data-expert="'+e.id+'">'+esc(n)+'</button>':esc(n);}).join(", ")+'</dd>'+
      '<dt>Raised by</dt><dd>'+esc(i.raisedBy)+'</dd>'+
      '<dt>Opened</dt><dd class="mono">'+esc(i.opened)+'</dd>'+
      '<dt>Match confidence</dt><dd>'+i.confidence+'%</dd></dl></div>'+

    '<div class="d-sec"><div class="eyebrow">History</div><div class="tl">'+
      i.timeline.map(t=>
        '<div class="tl-item"><div><span class="tl-dot" data-kind="'+t[2]+'"></span></div>'+
          '<div class="tl-body"><div class="tl-when">'+esc(t[0])+'</div>'+
            '<div class="tl-what">'+esc(t[1])+'</div>'+
            (t[3]?'<div class="tl-who">'+esc(t[3])+'</div>':"")+'</div></div>').join("")+
    '</div></div>'+

    (i.similar.length?'<div class="d-sec"><div class="eyebrow">Similar incidents</div><div class="mini">'+
      i.similar.map(c=>{const s=inc(c); if(!s) return "";
        return '<button class="mini-row" data-incident="'+c+'">'+
          '<span class="row-stripe" style="background:'+sevColor(s.priority)+';min-height:20px"></span>'+
          '<span class="m-title">'+esc(s.title)+'</span>'+
          '<span class="mono" style="color:var(--ink-3);font-size:11px">'+c+'</span>'+
          '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>';}).join("")+
    '</div></div>':"")+

    (kb?'<div class="d-sec"><div class="eyebrow">Linked knowledge</div>'+
      '<button class="mini-row" data-knowledge="'+kb.id+'"><span class="m-title">'+esc(kb.issue)+'</span>'+
      (kb.hasDoc?pill("pill-good","✓","Published"):pill("pill-warn","◔","Draft"))+
      '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button></div>':"")};
}

function drawerExpert(id){
  const e=byId(DATA.experts,id); if(!e) return null;
  const hist=expIncidents(e.name);
  const total=e.skills.reduce((a,s)=>a+s[1],0);
  return {kind:"Expert profile", title:e.name, body:''+
    '<div class="d-sec"><dl class="kv">'+
      '<dt>Role</dt><dd>'+esc(e.role)+'</dd>'+
      '<dt>Team</dt><dd>'+esc(e.team)+'</dd>'+
      '<dt>Resolved</dt><dd>'+total+' incidents</dd></dl></div>'+

    '<div class="d-sec"><div class="eyebrow">Skills &amp; systems</div><div class="mini">'+
      e.skills.map(s=>{const sy=DATA.systems.find(x=>x.id===s[0]);
        const inner='<span class="m-title">'+esc(sy?sy.name:s[0])+'</span>'+
          '<span style="color:var(--ink-2)">'+s[1]+' resolved</span>'+
          '<span style="color:var(--ink-3);font-size:11px">'+esc(s[2])+'</span>';
        return shown("systems")
          ? '<button class="mini-row" data-system="'+s[0]+'">'+inner+
            '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>'
          : '<span class="mini-row" style="cursor:default">'+inner+'</span>';}).join("")+
    '</div></div>'+

    '<div class="d-sec"><div class="eyebrow">Incident history</div>'+
      (hist.length?'<div class="mini">'+hist.map(i=>
        '<button class="mini-row" data-incident="'+i.code+'">'+
          '<span class="row-stripe" style="background:'+sevColor(i.priority)+';min-height:20px"></span>'+
          '<span class="m-title">'+esc(i.title)+'</span>'+statPill(i.status)+
          '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>').join("")+'</div>'
      :'<p class="prose">No incidents linked yet. Ranking stays flat until history accumulates.</p>')+
    '</div>'+

    '<div class="d-sec"><div class="eyebrow">Why recommended</div><p class="prose">'+
      (total>0
        ? 'Ranked on '+total+' resolved incidents in '+e.skills.map(s=>s[0]).join(", ")+'.'
        : 'Matched on declared skills only &mdash; <strong>no resolved history yet</strong>, so this recommendation is weak. Expert ranking is workstream 5.')+
    '</p></div>'};
}

function drawerKnowledge(id){
  const k=byId(DATA.knowledge,id); if(!k) return null;
  const src=inc(k.source);
  const sy=DATA.systems.find(s=>s.name===k.system);
  const author=expByName(k.by);
  return {kind:"Knowledge article", title:k.issue, body:''+
    '<div class="d-sec"><div style="display:flex;gap:6px;flex-wrap:wrap">'+
      (k.hasDoc?pill("pill-good","✓","Published"):pill("pill-warn","◔","Draft"))+
      '<span class="pill pill-mute">reused '+k.reuse+'&times;</span></div></div>'+

    '<div class="d-sec"><div class="eyebrow">Record</div><dl class="kv">'+
      '<dt>System</dt><dd>'+(sy&&shown("systems")?'<button class="link-btn" data-system="'+sy.id+'">'+esc(k.system)+'</button>':esc(k.system))+'</dd>'+
      '<dt>Team</dt><dd>'+esc(k.team)+'</dd>'+
      '<dt>Resolved by</dt><dd>'+(author?'<button class="link-btn" data-expert="'+author.id+'">'+esc(k.by)+'</button>':esc(k.by))+'</dd>'+
      '<dt>Tags</dt><dd>'+k.tags.map(t=>'<span class="chip">'+t+'</span>').join(" ")+'</dd></dl></div>'+

    '<div class="d-sec"><div class="eyebrow">Symptoms</div><p class="prose">'+esc(k.symptoms)+'</p></div>'+
    '<div class="d-sec"><div class="eyebrow">Resolution</div><p class="prose">'+esc(k.resolution)+'</p></div>'+

    (src?'<div class="d-sec"><div class="eyebrow">Source</div>'+
      '<button class="mini-row" data-incident="'+src.code+'">'+
        '<span class="row-stripe" style="background:'+sevColor(src.priority)+';min-height:20px"></span>'+
        '<span class="m-title">'+esc(src.title)+'</span>'+
        '<span class="mono" style="color:var(--ink-3);font-size:11px">'+src.code+'</span>'+
        '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button></div>':"")};
}

function drawerSystem(id){
  const s=byId(DATA.systems,id); if(!s) return null;
  const is=sysIncidents(id), ex=sysExperts(id), kb=sysKnowledge(id);
  return {kind:"System", title:s.name, body:''+
    '<div class="d-sec"><p class="prose">'+esc(s.desc)+'</p>'+
      '<dl class="kv"><dt>Owning team</dt><dd>'+esc(s.team)+'</dd></dl></div>'+

    '<div class="d-sec"><div class="eyebrow">Experts ('+ex.length+')</div><div class="mini">'+
      ex.map(e=>{const n=e.skills.filter(k=>k[0]===id).reduce((a,k)=>a+k[1],0);
        return '<button class="mini-row" data-expert="'+e.id+'">'+
          '<span class="avatar" style="width:22px;height:22px;font-size:10px" aria-hidden="true">'+initials(e.name)+'</span>'+
          '<span class="m-title">'+esc(e.name)+'</span>'+
          '<span style="color:var(--ink-2)">'+n+'</span>'+
          '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>';}).join("")+
    '</div></div>'+

    '<div class="d-sec"><div class="eyebrow">Incidents ('+is.length+')</div><div class="mini">'+
      (is.map(i=>'<button class="mini-row" data-incident="'+i.code+'">'+
        '<span class="row-stripe" style="background:'+sevColor(i.priority)+';min-height:20px"></span>'+
        '<span class="m-title">'+esc(i.title)+'</span>'+statPill(i.status)+
        '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>').join("")||'<p class="prose">None.</p>')+
    '</div></div>'+

    '<div class="d-sec"><div class="eyebrow">Knowledge ('+kb.length+')</div><div class="mini">'+
      (kb.map(k=>'<button class="mini-row" data-knowledge="'+k.id+'">'+
        '<span class="m-title">'+esc(k.issue)+'</span>'+
        (k.hasDoc?pill("pill-good","✓","Published"):pill("pill-warn","◔","Draft"))+
        '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>').join("")||'<p class="prose">None yet.</p>')+
    '</div></div>'};
}

/* ================================================================
   WIRING
   ================================================================ */
const drawer=document.getElementById("drawer");
const scrim=document.getElementById("scrim");
let lastFocus=null;

function setActive(id){
  ALL_VIEWS.forEach(v=>document.getElementById("v-"+v.id).setAttribute("data-active",String(v.id===id)));
}

function go(id){
  if(!RENDER[id]||!shown(id)) return;
  current=id;
  document.getElementById("v-"+id).innerHTML=RENDER[id]();
  setActive(id);
  renderNav();
  window.scrollTo(0,0);
}

function openDrawer(spec){
  if(!spec) return;
  lastFocus=document.activeElement;
  document.getElementById("drawerKind").textContent=spec.kind;
  document.getElementById("drawerTitle").textContent=spec.title;
  document.getElementById("drawerBody").innerHTML=spec.body;
  document.getElementById("drawerBody").scrollTop=0;
  drawer.setAttribute("data-open","true");
  drawer.setAttribute("aria-hidden","false");
  scrim.setAttribute("data-open","true");
  document.getElementById("drawerClose").focus();
}

function closeDrawer(){
  drawer.setAttribute("data-open","false");
  drawer.setAttribute("aria-hidden","true");
  scrim.setAttribute("data-open","false");
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}

/* one delegated handler — every data-* hook routes from here */
document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-goto],[data-incident],[data-expert],[data-knowledge],[data-system],[data-ws]");
  if(!t)return;
  if(t.hasAttribute("data-goto")){ closeDrawer(); go(t.getAttribute("data-goto")); return; }
  if(t.hasAttribute("data-incident")) return openDrawer(drawerIncident(t.getAttribute("data-incident")));
  if(t.hasAttribute("data-expert"))   return openDrawer(drawerExpert(t.getAttribute("data-expert")));
  if(t.hasAttribute("data-knowledge"))return openDrawer(drawerKnowledge(t.getAttribute("data-knowledge")));
  if(t.hasAttribute("data-system"))   return openDrawer(drawerSystem(t.getAttribute("data-system")));
  if(t.hasAttribute("data-ws")){
    const body=document.getElementById("ws-"+t.getAttribute("data-ws"));
    const open=body.getAttribute("data-open")==="true";
    body.setAttribute("data-open",String(!open));
    t.setAttribute("aria-expanded",String(!open));
  }
});

document.getElementById("drawerClose").addEventListener("click",closeDrawer);
scrim.addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

/* search — knowledge first, then people, then tickets: the bot's own order */
const q=document.getElementById("q");
let beforeSearch="overview";
q.addEventListener("input",()=>{
  const s=q.value.trim().toLowerCase();
  if(!s){ go(beforeSearch); return; }
  if(current!=="search") beforeSearch=current;
  const hitI=DATA.incidents.filter(i=>(i.title+i.code+i.category+i.team).toLowerCase().indexOf(s)>=0);
  const hitE=DATA.experts.filter(e=>(e.name+e.role+e.team+e.skills.map(k=>k[0]).join("")).toLowerCase().indexOf(s)>=0);
  const hitK=DATA.knowledge.filter(k=>(k.issue+k.symptoms+k.resolution+k.tags.join("")).toLowerCase().indexOf(s)>=0);
  const n=hitI.length+hitE.length+hitK.length;
  current="search";
  setActive("overview");
  document.getElementById("v-overview").innerHTML=''+
    '<div class="view-head"><div class="eyebrow">Search</div>'+
      '<h1>'+n+' result'+(n===1?"":"s")+' for &ldquo;'+esc(q.value)+'&rdquo;</h1>'+
      '<p>Knowledge first, then people, then tickets &mdash; the order the bot answers in.</p></div>'+
    (hitK.length?'<div class="panel"><div class="panel-head"><h3>Knowledge</h3><span class="hint">'+hitK.length+'</span></div>'+
      '<div class="row-list">'+hitK.map(k=>
        '<button class="row" data-knowledge="'+k.id+'">'+
          '<span class="row-main"><span class="row-title">'+esc(k.issue)+'</span>'+
            '<span class="row-meta">'+esc(k.system)+' &middot; reused '+k.reuse+'&times;</span></span>'+
          '<span class="row-right">'+(k.hasDoc?pill("pill-good","✓","Published"):pill("pill-warn","◔","Draft"))+'</span>'+
          '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>').join("")+'</div></div>':"")+
    (hitE.length?'<div class="panel"><div class="panel-head"><h3>Experts</h3><span class="hint">'+hitE.length+'</span></div>'+
      '<div class="row-list">'+hitE.map(e=>
        '<button class="row" data-expert="'+e.id+'">'+
          '<span class="avatar" aria-hidden="true">'+initials(e.name)+'</span>'+
          '<span class="row-main"><span class="row-title">'+esc(e.name)+'</span>'+
            '<span class="row-meta">'+esc(e.role)+' &middot; '+esc(e.team)+' &middot; '+e.skills.reduce((a,s)=>a+s[1],0)+' resolved</span></span>'+
          '<span class="row-chevron" aria-hidden="true">&rsaquo;</span></button>').join("")+'</div></div>':"")+
    (hitI.length?'<div class="panel"><div class="panel-head"><h3>Incidents</h3><span class="hint">'+hitI.length+'</span></div>'+
      '<div class="row-list">'+hitI.map(incRow).join("")+'</div></div>':"")+
    (n===0?'<div class="panel"><div class="empty">No match. In the bot this is where a knowledge gap gets logged '+
      'and raising an incident is offered.</div></div>':"");
});

/* theme — cycles system / light / dark */
const themeBtn=document.getElementById("themeBtn");
const modes=[null,"light","dark"], labels=["Theme","Light","Dark"];
let mode=0;
themeBtn.addEventListener("click",()=>{
  mode=(mode+1)%3;
  if(modes[mode])document.documentElement.setAttribute("data-theme",modes[mode]);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.textContent=labels[mode];
});

go("overview");
</script>
